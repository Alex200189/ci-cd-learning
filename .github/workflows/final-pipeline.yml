name: Финальный CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: echo "Linting code..."
    
  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [16, 18]
    steps:
      - name: тестируем разные версии
        run: echo "Testing on Node.js ${{ matrix.node-version }}"
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: |
         mkdir -p dist
         echo "test" > dist/app.js
      - name: загружаем как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/ 
  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: скачивает артефакт
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - run: echo "Deploying to production..."   
