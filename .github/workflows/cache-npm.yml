name: Кеширование npm
on:
  push:

jobs:
  install:
    steps:
      - name: скачиваем код
        uses: actions/checkout@v4

      - name: ставим node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: кэширование
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
          
      - name: запуск установки
        run: npm install
      
    
